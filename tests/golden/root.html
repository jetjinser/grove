        var panel = details.querySelector('.forest-tree-content');
        panel.innerHTML = content.innerHTML;
        panel.classList.add('backmatter-full');
        details.dataset.full = 'done';
      })
      .catch(function () { delete details.dataset.full; });
  }
  document.querySelectorAll('section.forest-tree-block.backmatter')
    .forEach(function (entry) {
